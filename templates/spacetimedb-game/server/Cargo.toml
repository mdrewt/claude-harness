[package]
name = "{{NAME}}-module"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin this to the SAME version as the `spacetime` CLI/host you publish against.
# The crate version IS the product version (since crate 2.0.0): CLI 2.8.1 <-> crate
# 2.8.1. There is no crate/product decoupling — if these drift you are writing
# against a different API than you deploy on. Check with:
#   spacetime --version
#   curl -s https://crates.io/api/v1/crates/spacetimedb/versions | head
# Uncomment when you implement tables/reducers (see src/lib.rs sketch).
# spacetimedb = "2.8.1"
